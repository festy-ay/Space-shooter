name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame-ce moderngl numpy

      - name: Build Windows EXE with PyInstaller
        working-directory: Main
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "Space Shooter" `
            --add-data "images;images" `
            --add-data "Code;Code" `
            --add-data "Shader;Shader" `
            --add-data "Font;Font" `
            --hidden-import glcontext `
            main.py

      - name: Zip Windows Build
        working-directory: Main/dist
        run: |
          Compress-Archive -Path "Space Shooter.exe" -DestinationPath "Space-Shooter-Windows-x64.zip"

      - name: Upload Build Artifact (for manual test runs)
        uses: actions/upload-artifact@v7
        with:
          name: Space-Shooter-Windows-x64
          path: Main/dist/Space-Shooter-Windows-x64.zip

      - name: Attach to GitHub Release (if triggered by a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Main/dist/Space-Shooter-Windows-x64.zip
